<script>

  class TreeData {

    id = "";
    data = new Object();
    dataLink = "";
    htmlHolderId = "";
    htmlElem = new Object();
    dataIconBase = "";
    renderingMode = "";
    nodesOpenMode = "";



    constructor (
      id,
      dataLink,
      data,
      htmlHolderId,
      htmlElem,
      dataIconBase,
      renderingMode,
      nodesOpenMode
    ) {
      this.id = id || "";

      if ( this.id === "" ) {
        throw new Error( "Required Data ID." );
      }

      this.dataLink = dataLink || "";
      this.data = data || new Object();
      this.htmlHolderId = htmlHolderId || "";
      if ( this.htmlHolderId === "" ) {
        throw new Error( "Required HtmlHolder ID." );
      }

      this.dataIconBase = dataIconBase || "";
      this.renderingMode = renderingMode;
      this.nodesOpenMode = nodesOpenMode;
    }

  }



  class TreeExamples {

    #treeInstances = new Object();
    #treeData = new Object();
    tsHtml = 1;

    treeJsonDataIconBase = "";


    constructor() {
      // super();

      this.#treeInstances = new Object();
      this.#treeData = new Object();
      this.tsHtml = 1;

      this.treeJsonDataIconBase = "";
    }


    setDataItems ( treeData ) {
      this.#treeData = treeData;

      return this;
    }

    addDataItem( inData ) {
      const treeDataId = inData.id;
      this.#treeData[ treeDataId ] = inData;

      return this;
    }

    getTreeData() {
      return this.#treeData;
    }

    getDataItemById( treeDataId ) {
      const dataItem = this.#treeData[ treeDataId ];
      return dataItem;
    }


    exampleFunc( inSelector, jsonItem, eventPayload ) {

      let text = ( jsonItem.text ) ?? "";
      let tagImg_miniImage = eventPayload.treeHtmlNode.querySelector( ".jstree-html-node-holder-icon > img" );
      let imgSrc = tagImg_miniImage.getAttribute( "src" );
      let imgAlt = tagImg_miniImage.getAttribute( "alt" );

      if ( this.tsHtml === 1 ) {
          this.tsHtml = document.body.querySelector( inSelector );
      }

      this.tsHtml.innerHTML = `
        <img class="mini_image" src="${imgSrc}" alt="${imgAlt}" />
        <div>${text}</div>`;
    }



    loadDataAndRenderTree (
      id,
      holderElemId,
      dataOrLink,
      renderingMode,
      modeShownNodes,
      whetherDataLink,
      debug
    ) {

        // example to load by url
        this.#treeInstances[ id ] = new JaisocxLockViewer();
        let lockViewer = this.#treeInstances[ id ];

        lockViewer
          .setDebug( debug )
          .setMainHtmlNodeId( holderElemId )
          .setNodesWithIcons( true )
          .setRenderingMode( renderingMode )
          .setNodesOpenedMode( modeShownNodes )
          .setModifiable( false )
          .addJSTreeEventListener (
              TreeConstants.TreeEventsNames.EVENT_NAME__AFTER_RENDER_ONE_NODE,
              ( eventName, eventPayload ) => {
                lockViewer.beforeRenderOneNode( eventName, eventPayload );
              }

          ).addJSTreeEventListener (
              TreeConstants.TreeEventsNames.EVENT_NAME__TREE_NODE_LABEL__CLICK,
              ( eventName, eventPayload ) => {
                  let loc_treeClassInstance = lockViewer;

                  if ( this.debug === true ) {

                    //# example to obtain of the current tree node the data that was used to render the tree.
                    let treeNodeData = {
                      "treeClassInstance": loc_treeClassInstance,
                      "eventName": eventName,
                      "eventPayload": eventPayload,
                      "flatClone": eventPayload.jsonNode._flatClone,
                      "deepClone": loc_treeClassInstance.getTreeDataByJPath( eventPayload.jsonNode._pathArray )
                    };

                    console.log( { treeNodeData } );
                  }

                  this.exampleFunc( ".testing_html", eventPayload.jsonNode._flatClone, eventPayload );
              }
           ).addThisClassEventListener (
              "AFTER_RENDER",
              ( eventName, treeExamplesRenderPayload ) => {
                  if ( treeExamplesRenderPayload.id !== "pkglck" ) {
                    return 2;
                  }

                  let counter = 1;
                  let ix = 1;
                  let packs = treeExamplesRenderPayload.pack;
                  let pack_cp = ( new Object() );
                  let packKeys = Object.keys( packs );
                  let packNumber = packKeys.length;
                  let correctionNumber = 2;
                  let counterMax = ( packNumber + 1 );
                  let item = ( new Object() );
                  let newItem = ( new Object() );
                  let key = ( new Object() );
                  let newKey = ( new Object() );
                  let verEncounteredNum = 1;

                  ci_payload_cp: while ( counter < counterMax ) {
                    counter += 1;
                    if ( counter > counterMax ) {
                      break ci_payload_cp;
                    }

                    ix = ( counter - correctionNumber );
                    key = packKeys[ ix ];
                    item = packs[ key ];
                    newItem = ( new Object() );

                    let versionsEncounteredKeys = Object.keys( item.counters.versionsEncountered );
                    let verEncounteredNum = versionsEncounteredKeys.length;
                    if ( verEncounteredNum === 0 ) {
                      newKey = [ item.packageName, "@", item.packageVersion, "___n", "0" ].join( "" );
                      newItem = "❎";
                    } else if ( verEncounteredNum === 1 ) {
                      if ( item.packageVersion === versionsEncounteredKeys[ 0 ] ) {
                        newKey = [ item.packageName, "@", item.packageVersion, "___n", "1_", "✅" ].join( "" );
                      } else {
                        newKey = [ item.packageName, "@", item.packageVersion, "___n", "1_", "🔔" ].join( "" );
                      }
                      newItem = item.counters.versionsEncountered;

                    } else {
                      newKey = [ item.packageName, "@", item.packageVersion, "___n", Number( verEncounteredNum ).toString(), "_", "🟥" ].join( "" );
                      newItem = item.counters.versionsEncountered;
                    }
                    pack_cp[ newKey ] = newItem;

                    continue ci_payload_cp;
                  }



                  let treeDataId = "clean_tree";
                  let dataItem = glob_dataItems[ treeDataId ];

                  if ( this.#treeInstances[ treeDataId ] ) {
                    this.#treeInstances[ treeDataId ].mainHolderHtmlNode.innerHTML = "";
                    this.#treeInstances[ treeDataId ] = null;
                  }

                  this.loadDataAndRenderTree (
                    dataItem[ "id" ],
                    dataItem[ "htmlHolderId" ],
                    treeExamplesRenderPayload,
                    dataItem[ "renderingMode" ],
                    dataItem[ "nodesOpenMode" ],
                    ( dataItem[ "dataMode" ] === "link" ),
                    dataItem[ "debug" ]
                  );


                  treeDataId = "pack";
                  dataItem = glob_dataItems[ treeDataId ];

                  if ( this.#treeInstances[ treeDataId ] ) {
                    this.#treeInstances[ treeDataId ].mainHolderHtmlNode.innerHTML = "";
                    this.#treeInstances[ treeDataId ] = null;
                  }

                  this.loadDataAndRenderTree (
                    dataItem[ "id" ],
                    dataItem[ "htmlHolderId" ],
                    pack_cp,
                    dataItem[ "renderingMode" ],
                    dataItem[ "nodesOpenMode" ],
                    ( dataItem[ "dataMode" ] === "link" ),
                    dataItem[ "debug" ]
                  );
            } );


           if ( whetherDataLink ) {
             fetch( dataOrLink )
              .then( ( response ) => { return response.json(); } )
              .then( ( data ) => {
                lockViewer.render( data );

                let eventPayload = {
                  "id": id,
                  "pack": lockViewer.getJsPack(),
                  "counters": lockViewer.getCounters()
                };

                lockViewer.emitEvent( "AFTER_RENDER", eventPayload );

                // console.log( eventPayload.pack );
                // console.log( eventPayload.counters );
              } );

             // lockViewer.load( dataOrLink );
           } else {
             lockViewer.render( dataOrLink );
           }

           return 2;
    }



    renderExamples() {

      let keys = Object.keys( this.#treeData );
      let counter = 1;
      let itemsNumber = keys.length;
      let maxCounter = ( itemsNumber + 2 );

      let elem = document.getElementsByTagName( "BODY" )[ 0 ];
      let dataOrLink = [];

      loop: while( counter < maxCounter ) {
        counter++;
        if ( counter >= maxCounter ) {
          break loop;
        }

        let itemCounter = ( counter - 2 );
        let id = keys[ itemCounter ];
        let dataItem = this.#treeData[ id ];

        if ( dataItem[ "dataMode" ] === "link" ) {
          if (
            ( dataItem[ "dataLink" ] === undefined )
            || ( dataItem[ "dataLink" ] === null )
            || ( dataItem[ "dataLink" ].length === 0 )
          ) {
            continue loop;
          }

          dataOrLink = dataItem[ "dataLink" ];

        } else {
          if (
            ( dataItem[ "data" ] === undefined )
            || ( dataItem[ "data" ] === null )
            || ( dataItem[ "data" ].length === 0 )
          ) {
            continue loop;
          }

          dataOrLink = dataItem[ "data" ];

        }


        this.loadDataAndRenderTree (
          dataItem[ "id" ],
          dataItem[ "htmlHolderId" ],
          dataOrLink,
          dataItem[ "renderingMode" ],
          dataItem[ "nodesOpenMode" ],
          ( dataItem[ "dataMode" ] === "link" ),
          dataItem[ "debug" ]
        );

      }

      return 2;
    }
  }
</script>



<script name="event_site_loaded">

  let treeExamplesInstance = new Object();

  let glob_dataItems = {
    "all": {
      id: "all",
      dataMode: "link",
      dataLink: "html_examples_sites_tools/lock_viewer/data/Jaisocx_package.json",
      data: [],
      htmlHolderId: "tree_holder_0",
      htmlElem: null,
      dataIconBase: "node_cdn_installs/node_modules/@jaisocx/tree/MediaAndStyles/themes/theme-funny/mini-images/data-types/",
      renderingMode: "mode_ease",
      nodesOpenMode: "all_hide",
      debug: false
    },
    "pkglck": {
      id: "pkglck",
      dataMode: "link",
      dataLink: "node_cdn_installs/package-lock.json",
      data: [],
      htmlHolderId: "tree_holder_1",
      htmlElem: null,
      dataIconBase: "node_cdn_installs/node_modules/@jaisocx/tree/MediaAndStyles/themes/theme-funny/mini-images/data-types/",
      renderingMode: "mode_ease",
      nodesOpenMode: "all_hide",
      debug: false
    },
    "clean_tree": {
      id: "clean_tree",
      dataMode: "jsObject",
      dataLink: "",
      data: [],
      htmlHolderId: "tree_holder_2",
      htmlElem: null,
      dataIconBase: "node_cdn_installs/node_modules/@jaisocx/tree/MediaAndStyles/themes/theme-funny/mini-images/data-types/",
      renderingMode: "mode_ease",
      nodesOpenMode: "all_hide",
      debug: false
    },
    "pack": {
      id: "pack",
      dataMode: "jsObject",
      dataLink: "",
      data: [],
      htmlHolderId: "tree_holder_3",
      htmlElem: null,
      dataIconBase: "node_cdn_installs/node_modules/@jaisocx/tree/MediaAndStyles/themes/theme-funny/mini-images/data-types/",
      renderingMode: "mode_ease",
      nodesOpenMode: "all_shown",
      debug: false
    }
  };



  document.addEventListener (
    "DOMContentLoaded",
    function ( evt ) {
      glob_dataItems[ "all" ][ "renderingMode" ] = TreeConstants.RenderingMode.Ease;
      glob_dataItems[ "all" ][ "nodesOpenMode" ] = TreeConstants.NodesOpenedMode.ALL_HIDE;

      glob_dataItems[ "pkglck" ][ "renderingMode" ] = TreeConstants.RenderingMode.Ease;
      glob_dataItems[ "pkglck" ][ "nodesOpenMode" ] = TreeConstants.NodesOpenedMode.ALL_HIDE;

      glob_dataItems[ "clean_tree" ][ "renderingMode" ] = TreeConstants.RenderingMode.Ease;
      glob_dataItems[ "clean_tree" ][ "nodesOpenMode" ] = TreeConstants.NodesOpenedMode.ALL_HIDE;

      glob_dataItems[ "pack" ][ "renderingMode" ] = TreeConstants.RenderingMode.Ease;
      glob_dataItems[ "pack" ][ "nodesOpenMode" ] = TreeConstants.NodesOpenedMode.ALL_HIDE;

      treeExamplesInstance = new TreeExamples();
      treeExamplesInstance
        .setDataItems( glob_dataItems )
        .renderExamples();
    }
  );

</script>
