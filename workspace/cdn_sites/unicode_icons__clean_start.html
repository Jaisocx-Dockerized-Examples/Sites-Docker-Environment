<!DOCTYPE html>
<html lang="en" class="jaisocx clean_start theme_fonts_a">
<head>

  <!--# FAVICON -->
  <link
      rel="icon"
      type="image/x-icon"
      href="favicon/Icon_Jaisocx.ico"
  />

  <title> Unicode icons </title>



  <base href="./example__sites_tools/css__clean_start_2026__zero/" />

  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />





  <!--# Clean start zero Fonts -->
  <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="MediaAndStyles/clean_start_zero__fonts.css"
  />


  <!--# Clean start zero Site -->
  <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="MediaAndStyles/clean_start_zero__site.css"
  />



  <!--# CleanStart_Tiny Html tags ( h1, h2, label, text, p, pre ) -->
  <!-- <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="MediaAndStyles/clean_start_zero__html_tags.css"
  /> -->




  <style name="clean_start_zero__theme">

    .jaisocx.clean_start {

      --clean_start--rem:      16px;

      --clean_start--all_tags--font-size:      0.9rem;
      --clean_start--all_tags--line-height:    1.2rem;

      --clean_start--all_tags--border-width:   0;

      --clean_start--site--background:         #fdfdfd;
      --clean_start--body_tag--background:     #eefdf4;

      --clean_start--site--padding:            1rem 3rem 20rem 3rem;
      --clean_start--site--width:              55%;

      --clean_start--scrollbar-thumb--background-color:   lime;
      --clean_start--scrollbar-track--background-color:   #eafdfa;
      --clean_start--scrollbar--color:                    lime #eafdfa;

    }

  </style>



  <!-- CleanStart_Tiny Overrides -->
  <style name="overrides">

    .jaisocx.clean_start h1 {
      font-size:                  1.2rem;
      line-height:                1.45rem;
      font-weight:                900;
      margin:                     0 0 0.4rem 0;
      color:                      #40be30;
      background:                 #fefefe;
      border:                     0 solid lime;
    }

    .jaisocx.clean_start h2 {
      margin:                     2rem 0 0.21rem 0;
    }
    .jaisocx.clean_start h3 {
      margin:                     2rem 0 0.21rem 0;
    }
    .jaisocx.clean_start h4 {
      margin:                     2rem 0 0.21rem 0;
    }

    .jaisocx.clean_start h2:first-of-type {
      margin:                     1rem 0 1rem 0;
    }

    .jaisocx.clean_start h2 ~ h3,
    .jaisocx.clean_start h2 ~ block > h3:first-of-type {
      margin:                     0.4rem 0 0.21rem 0;
    }

    .jaisocx.clean_start h3 ~ h4,
    .jaisocx.clean_start h3 ~ block > h4:first-of-type {
      margin:                     0.4rem 0 0.21rem 0;
    }



      /* label */
    .jaisocx.clean_start label {
      display:                    inline-block;

      font-size:                  0.79rem;
      line-height:                0.79rem;

      padding:                    0.18rem 0.9rem 0.10rem 0.9rem;
      margin:                     0 0 0 0;

      color:                      #40be30;
      background:                 #fefefe;

      border:                     2px solid #99faa9;
      border-radius:              0.8rem;

      overflow-x:                  hidden;
      overflow-y:                  hidden;
    }



      /* hyperlinks <a href="url"> */
    .jaisocx.clean_start a {
      color:                     navy;
    }
    .jaisocx.clean_start a:hover {
      color:                     #2255ab;
    }



      /* paragraphs <p> */
    .jaisocx.clean_start p {
      margin:                    1rem 0 0 0;
    }
    .jaisocx.clean_start p:first-of-type {
      margin:                    0 0 0 0;
    }

  </style>



  <!-- CleanStart_Tiny Mobile friendly -->
  <style name="mobile_friendly">

    @media only screen and (min-width: 5px) and (max-width: 280px) and (min-height: 5px) and (max-height: 1240px) and (orientation: portrait) {
      .jaisocx.clean_start {
        --clean_start--site--padding:      1rem 0.3rem 2rem 0.3rem;
        --clean_start--site--width:        100%;
      }
    }

    @media only screen and (min-width: 281px) and (max-width: 480px) and (min-height: 431px) and (max-height: 1240px) and (orientation: portrait) {
      .jaisocx.clean_start {
        --clean_start--site--padding:      1.2rem 0.3rem 5rem 0.3rem;
        --clean_start--site--width:        92%;
      }
    }

    @media only screen and (min-width: 281px) and (max-width: 1024px) and (min-height: 5px) and (max-height: 480px) and (orientation: landscape) {
      .jaisocx.clean_start {
        --clean_start--site--padding:      0.3rem 0.3rem 1rem 0.3rem;
        --clean_start--site--width:        95%;
      }
    }

  </style>


</head>
<body>
<main>

<h1> Unicode icons </h1>

  <block>

    <p>

      🌨
      🌷
      🌼
      🌾

    </p>

    <p>
      ⚡   🌐    🖥️   🧭    📅    🗓
    </p>

    <p>
           ✨   💡   ✅    ❎   ⛔   ❌  ❓  ❗
    </p>

    <p>
      📐   📚    🗂     📦     📒     📊    📄    🏷
    </p>

    <p>
           🟠   🟡   🟢   🟣   🟤   🟥   🟦   🔴   🔵   🔶   🔷   🔸   🔹   🔺   🔻
    </p>

  </block>

</main>
</body>
</html>
