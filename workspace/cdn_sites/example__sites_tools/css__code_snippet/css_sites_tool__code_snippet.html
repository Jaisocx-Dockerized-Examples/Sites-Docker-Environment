  <style name="css_code_snippet_overrides">

    .sites_tools {
      --code_snippet_lines_numbers--20:                    "\0031\00a\0032\00a\0033\00a\0034\00a\0035\00a\0036\00a\0037\00a\0038\00a\0039\00a\0031\0030\00a\0031\0031\00a\0031\0032\00a\0031\0033\00a\0031\0034\00a\0031\0035\00a\0031\0036\00a\0031\0037\00a\0031\0038\00a\0031\0039\00a\0032\0030\00a";
      --code_snippet_lines_numbers:                        var(--code_snippet_lines_numbers--20);
      --code_snippet_lines_qty:                            20;
    }

    .page.clean_start.sites_tools .CodeSnippetHolder#scrolling-codesnippet {

      */

      --code_snippet_lines_qty:                            20;
    }

        --code_snippet--padding-top:                         1rem;
        --code_snippet--padding-left:                        1rem;
        --code_snippet--padding-right:                       1rem;
        --code_snippet--padding-bottom:                      1rem;

        --code_snippet_numbers--padding-left:                0;
        --code_snippet_numbers--padding-right:               1rem;

        --code_snippet--line-height:                         0.92rem;

        --code_snippet_numbers--width:                       3rem;
    }



    .page.clean_start.sites_tools {

      --code_snippet--position:                            relative;
      --code_snippet--box-sizing:                          border-box;
      --code_snippet--margin:                              0 0 2rem 0;
      --code_snippet--font-family:                         var(--clean_start--monospace--font-family, Courier);
      --code_snippet--line-height:                         0.97rem;
      --code_snippet--font-size:                           0.8rem;
      --code_snippet--text-align:                          left;
      --code_snippet--min-height:                          unset;
      --code_snippet--max-height:                          unset;
      --code_snippet--height:                              auto;
      --code_snippet--min-width:                           unset;
      --code_snippet--max-width:                           unset;
      --code_snippet--width:                               100%;
      /* --code_snippet--border:                              2px solid lime; */
      --code_snippet--border-radius:                       1rem;
      /* --code_snippet--color:                               black; */
      /* --code_snippet--background:                          #fdfdfd; */
      --code_snippet--overflow-x:                           auto;
      --code_snippet--overflow-y:                           auto;
    }



    .page.clean_start.sites_tools code.CodeSnippetHolder#scrolling-codesnippet {

      --code_snippet_lines_qty:                            24;


      /* calculated */

      --code_snippet--padding-left:                        2.4rem;
      --code_snippet--padding-right:                       0.1rem;
      --code_snippet--padding-bottom:                      0.01rem;

      --code_snippet_numbers--padding-left:                0;
      --code_snippet_numbers--padding-right:               1rem;

      --code_snippet--line-height:                         0.92rem;

      --code_snippet_numbers--width:                       5rem;





      --code_snippet--min-height:                          unset;
      --code_snippet--max-height:                          unset;
      --code_snippet--height:                              16rem;

      --code_snippet--width:                               30rem;



      --code_snippet--block_tags--display:                 block;



      /* for the theme scrollable */

      --code_snippet_numbers--position:                    sticky;
      --code_snippet_area--position:                       absolute;
      --code_snippet_rightcolumn--position:                sticky;

      --code_snippet--overflow-x:                           auto;
      --code_snippet--overflow-y:                           auto;

      /* --code_snippet_holder--overflow-x:                 auto;
      --code_snippet_holder--overflow-y:                    auto; */

      --code_snippet_numbers--overflow-y:                   hidden;

      --code_snippet_rightcolumn--overflow-y:               hidden;

      --code_snippet_area--overflow-x:                      visible;
      --code_snippet_area--overflow-y:                      hidden;

<script src="./scripts/JaisocxThemeButtons_Constants.js"></script>
<script src="./scripts/JaisocxThemeButtons.js"></script>

<script>

    let g_keywordTheme = "theme";
    let g_keywordCurrent = "current";

    let g_HtmlClasses = [
      "jaisocx",
      "page",
      "clean_start",
      "sites_tools",
      "theme_fonts_a"
    ];

    let g_buttonIDs = [
      "button-turn-on-base",
      "button-turn-on-daymode",
      "button-turn-on-nightmode"
    ];



    function onload_ThemeAndEvents() {

      let loc_Cls_JaisocxThemeButtons = ( new JaisocxThemeButtons() );

          // if the call encommented,
          //   the html tag classname for the theme turns the look and feel for the page.
          loc_Cls_JaisocxThemeButtons
              .turnOnTheme_HtmlTagTheme_byMode (
                  JaisocxThemeButtons_Constants.THEME_TURN_ON_PRIORITY__THEME(),
                  "theme_rosa",
                  g_keywordTheme, g_keywordCurrent, g_HtmlClasses, g_buttonIDs
              );

          // adding to buttons the event handler to turn on the theme.
          loc_Cls_JaisocxThemeButtons
              .addThemeButtonsEventHandlers ( g_keywordTheme, g_keywordCurrent, g_HtmlClasses, g_buttonIDs );


          return 1;
    }



    // @sence in this example of the same method call,
    //   the variables examples seen very fine.
    function onload_JustAddsEvents() {

        let loc_Cls_JaisocxThemeButtons = ( new JaisocxThemeButtons() );

        // adding to buttons the event handler to turn on the theme.
        loc_Cls_JaisocxThemeButtons
            .addThemeButtonsEventHandlers (
                "theme",
                "current",
                [
                    "jaisocx",
                    "page",
                    "clean_start",
                    "sites_tools",
                    "theme_fonts_a"
                ],
                [
                    "button-turn-on-base",
                    "button-turn-on-daymode",
                    "button-turn-on-nightmode"
                ]
            );


        return 1;
    }



    // DOCUMENT ONLOAD, INVOKES THE FUNCTION TO PRELOAD THEME FONTS
  document.addEventListener ( 'DOMContentLoaded', () => {
      // the idea to keep the DOM event handlers thin.
      // JaisocxThemeButtons.onload();
      console.log( "Browser's tab event DOMContentLoaded ..." );

      // onload_ThemeAndEvents();
      onload_JustAddsEvents();

      console.log( "Browser's tab event DOMContentLoaded. The Javascript method called." );
  });

</script>
