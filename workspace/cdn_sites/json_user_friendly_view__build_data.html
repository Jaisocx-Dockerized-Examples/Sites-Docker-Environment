<script>

  const MAX_ITERATIONS_NUMBER   = 62;
  const MAX_B_ITERATIONS_NUMBER = 50;



  class TreeData {

    id = "";
    data = new Object();
    dataLink = "";
    htmlHolderId = "";
    htmlElem = new Object();
    dataIconBase = "";
    renderingMode = "";
    nodesOpenMode = "";



    constructor (
      id,
      dataLink,
      data,
      htmlHolderId,
      htmlElem,
      dataIconBase,
      renderingMode,
      nodesOpenMode
    ) {
      this.id = id || "";

      if ( this.id === "" ) {
        throw new Error( "Required Data ID." );
      }

      this.dataLink = dataLink || "";
      this.data = data || new Object();
      this.htmlHolderId = htmlHolderId || "";
      if ( this.htmlHolderId === "" ) {
        throw new Error( "Required HtmlHolder ID." );
      }

      this.dataIconBase = dataIconBase || "";
      this.renderingMode = renderingMode;
      this.nodesOpenMode = nodesOpenMode;
    }

  }



  class TreeExamples {

    #treeInstances = new Object();
    #treeData = new Object();
    tsHtml = 1;
    sitesTools = ( new Array() );

    treeJsonDataIconBase = "";


    constructor() {
      // super();

      this.#treeInstances = new Object();
      this.#treeData = new Object();
      this.tsHtml = 1;
      this.newSitesTools = ( new Array() );

      this.treeJsonDataIconBase = "";
    }


    setDataItems ( treeData ) {
      this.#treeData = treeData;

      return this;
    }

    addDataItem( inData ) {
      const treeDataId = inData.id;
      this.#treeData[ treeDataId ] = inData;

      return this;
    }

    getTreeData() {
      return this.#treeData;
    }

    getDataItemById( treeDataId ) {
      const dataItem = this.#treeData[ treeDataId ];
      return dataItem;
    }

    getSitesTools() {
      return this.sitesTools;
    }


    exampleFunc( inSelector, jsonItem, eventPayload ) {}

    examplefnc( inSelector, jsonItem, eventPayload ) {

      let text = ( jsonItem.text ) ?? "";
      let tagImg_miniImage = eventPayload.treeHtmlNode.querySelector( ".jstree-html-node-holder-icon > img" );
      let imgSrc = tagImg_miniImage.getAttribute( "src" );
      let imgAlt = tagImg_miniImage.getAttribute( "alt" );

      if ( this.tsHtml === 1 ) {
          this.tsHtml = document.body.querySelector( inSelector );
      }

      this.tsHtml.innerHTML = `
        <img class="mini_image" src="${imgSrc}" alt="${imgAlt}" />
        <div>${text}</div>`;
    }



    loadDataAndRenderTree (
      id,
      holderElemId,
      dataOrLink,
      renderingMode,
      modeShownNodes,
      whetherDataLink,
      debug
    ) {

        // example to load by url
        // this.#treeInstances[ id ] = new Tree();
        this.#treeInstances[ id ] = new JaisocxLockViewer();
        let lockViewer = this.#treeInstances[ id ];

        lockViewer
          .setDebug( debug )
          .setMainHtmlNodeId( holderElemId )
          .setNodesWithIcons( true )
          .setRenderingMode( renderingMode )
          .setNodesOpenedMode( modeShownNodes )
          .setModifiable( false )
          .addJSTreeEventListener (
              TreeConstants.TreeEventsNames.EVENT_NAME__AFTER_RENDER_ONE_NODE,
              ( eventName, eventPayload ) => {
                lockViewer.beforeRenderOneNode( eventName, eventPayload );
              }

          ).addJSTreeEventListener (
              TreeConstants.TreeEventsNames.EVENT_NAME__TREE_NODE_LABEL__CLICK,
              ( eventName, eventPayload ) => {
                  let loc_treeClassInstance = lockViewer;

                  if ( this.debug === true ) {

                    //# example to obtain of the current tree node the data that was used to render the tree.
                    let treeNodeData = {
                      "treeClassInstance": loc_treeClassInstance,
                      "eventName": eventName,
                      "eventPayload": eventPayload,
                      "flatClone": eventPayload.jsonNode._flatClone,
                      "deepClone": loc_treeClassInstance.getTreeDataByJPath( eventPayload.jsonNode._pathArray )
                    };

                    console.log( { treeNodeData } );
                  }

                  this.exampleFunc( ".testing_html", eventPayload.jsonNode._flatClone, eventPayload );
              }
           );



           if ( whetherDataLink ) {
             fetch( dataOrLink )
              .then( ( response ) => { return response.json(); } )
              .then( ( data ) => {

                lockViewer.render( data );

                let eventPayload = {
                  "id": id,
                  "pack": lockViewer.getJsPack(),
                  "counters": lockViewer.getCounters()
                };

                // lockViewer.emitEvent( "AFTER_RENDER", eventPayload );

                // console.log( eventPayload.pack );
                // console.log( eventPayload.counters );
              } );

             // lockViewer.load( dataOrLink );
           } else {

             lockViewer.render( dataOrLink );

           }

           return 2;
    }



    renderExamples() {

      let keys = Object.keys( this.#treeData );
      let counter = 1;
      let itemsNumber = keys.length;
      let loc_maxCounter = ( itemsNumber + 2 );

      let elem = document.getElementsByTagName( "BODY" )[ 0 ];
      let dataOrLink = [];

      loop: while( counter < loc_maxCounter ) {
        counter++;
        if ( counter >= loc_maxCounter ) {
          break loop;
        }

        let itemCounter = ( counter - 2 );
        let id = keys[ itemCounter ];
        let dataItem = this.#treeData[ id ];

        if ( dataItem[ "dataMode" ] === "link" ) {
          if (
            ( dataItem[ "dataLink" ] === undefined )
            || ( dataItem[ "dataLink" ] === null )
            || ( dataItem[ "dataLink" ].length === 0 )
          ) {
            continue loop;
          }

          dataOrLink = dataItem[ "dataLink" ];

        } else {
          if (
            ( dataItem[ "data" ] === undefined )
            || ( dataItem[ "data" ] === null )
            || ( dataItem[ "data" ].length === 0 )
          ) {
            continue loop;
          }

          dataOrLink = dataItem[ "data" ];

        }


        this.loadDataAndRenderTree (
          dataItem[ "id" ],
          dataItem[ "htmlHolderId" ],
          dataOrLink,
          dataItem[ "renderingMode" ],
          dataItem[ "nodesOpenMode" ],
          ( dataItem[ "dataMode" ] === "link" ),
          dataItem[ "debug" ]
        );

      }

      return 2;
    }



  /**
  * @returns updated in_buildData
  */
  sitesToolsNBuildData (
    in_sitesTools,
    in_buildData,
    in_maxCounter,
    in_b_maxCounter,
    in_offsetStep,
    in_b_offsetStep
  ) {

    let loc_sitesTools               = in_sitesTools;
    let llc_buildData                = in_buildData;

    let loc_maxCounter               = in_maxCounter;
    let loc_b_maxCounter             = in_b_maxCounter;

    let loc_offsetStep               = in_offsetStep;
    let loc_b_offsetStep             = in_b_offsetStep;

    let LOC_COUNTER_DEC              = 1;
    let LOC_MAX_COUNTER              = 1;

    let LOC_B_COUNTER_DEC            = 1;
    let LOC_B_MAX_COUNTER            = 1;

    // let toExit_from_a                = true;
    // let toExit_from_b                = true;

    let siteToolFound                = true;



    let loc_buildData                = [...llc_buildData];



    let loc_sitesTools_itemsNumber   = loc_sitesTools.length;
    let loc_sitesTools_LastPos       = ( loc_sitesTools_itemsNumber - 1 );
    let ci_sitesTools_item           = String( "" );

    let loc_buildData_itemsNumber    = loc_buildData.length;
    let loc_buildData_LastPos        = ( loc_buildData_itemsNumber - 1 );
    let cib_buildData_item           = ( new Object() );



    LOC_COUNTER_DEC                  = ( 1 + loc_offsetStep );
    LOC_MAX_COUNTER                  = ( MAX_ITERATIONS_NUMBER + LOC_COUNTER_DEC );

    LOC_B_COUNTER_DEC                = ( 1 + loc_b_offsetStep );
    LOC_B_MAX_COUNTER                = ( MAX_B_ITERATIONS_NUMBER + LOC_B_COUNTER_DEC );

    loc_maxCounter                   += loc_offsetStep;
    loc_b_maxCounter                 += loc_b_offsetStep;



    if ( loc_maxCounter > LOC_MAX_COUNTER ) {
      loc_maxCounter = LOC_MAX_COUNTER;
    }
    if ( loc_maxCounter > loc_sitesTools_itemsNumber ) {
      loc_maxCounter = loc_sitesTools_itemsNumber;
    }

    if ( loc_b_maxCounter > LOC_B_MAX_COUNTER ) {
      loc_b_maxCounter = LOC_B_MAX_COUNTER;
    }
    if ( loc_b_maxCounter > loc_buildData_itemsNumber ) {
      loc_b_maxCounter = loc_buildData_itemsNumber;
    }



    let ci_loopCounter               = 1;
    let ci_offset                    = 1;

    let cib_loopCounter              = 1;
    let cib_offset                   = 1;



    let ci_bibPathArray              = ( new Array() );
    let ci_bibPathArrLen             = 1;
    let ci_bibPathArrLastPos         = 1;
    let ci_bibPathArrLastStr         = String("");
    let ci_bibPathArrLastPath        = String("");

    // let cib_bibName_lastIndexOf      = 1;
    let cib_bibFound                 = true;



    let loc_funcStrFound = (
      in_o,
      in_key,
      in_strToFind
    ) => {

      let loc_o                      = in_o;
      let loc_key                    = in_key;
      let loc_strToFind              = in_strToFind;

      let loc_value                  = loc_o[ loc_key ];

      let loc_str_lastIndexOf        = 1;
      loc_str_lastIndexOf            = loc_value.lastIndexOf( loc_strToFind );
      let loc_bibFound               = ( loc_str_lastIndexOf !== (-1) );

      return ( loc_bibFound );
    };





    // let cib_buildData_item = ( new Object() );
    ci_marker_a: while ( ci_loopCounter < loc_maxCounter ) {

      ci_loopCounter += loc_b_offsetStep;
      if ( ci_loopCounter > loc_maxCounter ) {
        break ci_marker_a;
      }

      ci_offset = ( ci_loopCounter - LOC_COUNTER_DEC );
      if ( ci_offset > loc_sitesTools_LastPos ) {
        break ci_marker_a;
      }


      siteToolFound                  = false;
      ci_sitesTools_item             = loc_sitesTools[ ci_offset ];

      ci_bibPathArray                = ci_sitesTools_item.split( "/" );
      ci_bibPathArrLen               = ci_bibPathArray.length;
      ci_bibPathArrLastPos           = ( ci_bibPathArrLen - 1 );
      ci_bibPathArrLastStr           = ci_bibPathArray[ ci_bibPathArrLastPos ];
      ci_bibPathArrLastPath          = [ "/", ci_bibPathArrLastStr ].join( "" );

      // cib_bibName_lastIndexOf        = 1;
      cib_bibFound                   = true;
      // cib_bibFound                   = ( cib_bibName_lastIndexOf !== (-1) );

      // toExit_from_a                  = false;



      cib_loopCounter                = 1;
      cib_offset                     = 1;
      // toExit_from_b                  = false;

      ci_marker_b: while ( cib_loopCounter < loc_b_maxCounter ) {

        cib_loopCounter += loc_b_offsetStep;
        if ( cib_loopCounter > loc_b_maxCounter ) {
          break ci_marker_b;
        }

        cib_offset = ( cib_loopCounter - LOC_B_COUNTER_DEC );
        if ( cib_offset > loc_buildData_LastPos ) {
          break ci_marker_b;
        }

        /* if ( toExit_from_a === true ) {
          break ci_marker_a;
          // continue ci_marker_a;
        } */



        cib_buildData_item           = loc_buildData[ cib_offset ];
        cib_bibFound                 = loc_funcStrFound (
          cib_buildData_item,
          "path",
          ci_bibPathArrLastPath
        );



        if ( cib_bibFound === true ) {
          siteToolFound              = true;
          let cib_sitesTools_item = ci_sitesTools_item;
          loc_buildData[ cib_offset ][ "path" ] = cib_sitesTools_item;
        }



        let cib_bibDepsArray         = cib_buildData_item[ "dependencies" ];
        if ( ( !cib_bibDepsArray ) || ( cib_bibDepsArray.length === 0 ) ) {
          continue ci_marker_b;
        }


        let cib_bibResolvedDepsArray = ( new Array() );

        cib_bibResolvedDepsArray     = cib_bibDepsArray
          .map (
            ( cic_dep ) => {
              let cic_item = {...cic_dep};
              let cic_bibFound = loc_funcStrFound (
                cic_dep,
                "path",
                ci_bibPathArrLastPath
              );

              if ( cic_bibFound ) {
                cic_item[ "path" ]   = ci_sitesTools_item;
              }

              return ( cic_item );
            }
          );

        loc_buildData[ cib_offset ][ "dependencies" ] = cib_bibResolvedDepsArray;



        continue ci_marker_b;
      }
      // -- finish ci_marker_b --

      if ( siteToolFound === false ) {
        this.sitesTools.push( ci_sitesTools_item );
      }



      continue ci_marker_a;
    }
    // -- finish ci_marker_a --



    return loc_buildData;

  }
  // -- finish func g_sitesToolsNBuildData --


  }
</script>
